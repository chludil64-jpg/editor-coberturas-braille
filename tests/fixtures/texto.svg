<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <rect x="5" y="5" width="190" height="90" fill="none" stroke="#000"/>
  <!-- texto simple -->
  <text x="20" y="30" font-size="10" font-family="Arial">Hola mundo</text>
  <!-- tspan multilínea -->
  <text x="20" y="60" font-size="8"><tspan x="20" y="60">Primera línea</tspan><tspan x="20" y="70">Segunda línea</tspan></text>
  <!-- grupo con transformación -->
  <g transform="translate(100 10) scale(2)">
    <text x="10" y="20" font-size="5">Grupo &amp; escala</text>
  </g>
  <!-- text-anchor middle -->
  <text x="100" y="90" font-size="6" text-anchor="middle">Centrado</text>
  <!-- invisible y dentro de defs: no deben salir -->
  <text x="10" y="10" fill="none">Oculto</text>
  <defs><text x="1" y="1">En defs</text></defs>
</svg>
